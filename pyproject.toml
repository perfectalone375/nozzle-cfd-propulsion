[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nozzle-cfd-propulsion"
version = "0.3.0"
description = "Multi-propellant rocket propulsion & supersonic nozzle CFD digital twin (1D HLLC+/AUSM+ FVM, 2D Axisymmetric Navier-Stokes + OpenMP C++20, Numerical Schlieren, Bartz cooling) across Python, MATLAB/Octave, and C++20."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Gopi Naga Vignesh Thirupati"}
]
keywords = [
    "cfd",
    "rocket-propulsion",
    "aerospace",
    "maccormack",
    "method-of-characteristics",
    "matlab",
    "cpp",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.17.4",
]

[project.scripts]
nozzle-cfd = "nozzle_cfd.cli:main"
nozzle-cfd-mcp = "nozzle_cfd.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
